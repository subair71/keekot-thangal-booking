name: keekot_thangal
description: Secure visit booking for Keekot Thangal, Chavakkad.
publish_to: none
version: 1.0.0+1
environment:
  sdk: '>=3.10.0 <4.0.0'
dependencies:
  flutter:
    sdk: flutter
  flutter_web_plugins:
    sdk: flutter
  cupertino_icons: ^1.0.9
  firebase_core: ^4.14.0
  firebase_auth: ^6.6.1
  cloud_firestore: ^6.9.0
  firebase_messaging: ^16.6.0
  cloud_functions: ^6.4.0
  firebase_analytics: ^12.5.0
  firebase_app_check: ^0.4.7
  flutter_riverpod: ^3.4.3
  riverpod_annotation: ^4.0.7
  go_router: ^18.0.1
  flutter_svg: ^2.3.0
  qr_flutter: ^4.1.0
  pdf: ^3.13.0
  printing: ^5.15.0
  intl: ^0.20.3
  url_launcher: ^6.3.2
dev_dependencies:
  flutter_test:
    sdk: flutter
  riverpod_generator: ^4.0.9
  build_runner: ^2.16.1
  flutter_lints: ^6.0.0
flutter:
  uses-material-design: true
  assets:
    - assets/brand/
  fonts:
    - family: Newsreader
      fonts:
        - asset: assets/fonts/Newsreader.ttf
    - family: Plus Jakarta Sans
      fonts:
        - asset: assets/fonts/PlusJakartaSans.ttf

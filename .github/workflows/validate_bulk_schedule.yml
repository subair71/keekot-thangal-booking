name: Validate bulk schedule controls
on:
  push:
    branches: [admin/bulk-schedule]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.4'
          channel: stable
          cache: true
      - run: flutter pub get --enforce-lockfile
      - run: dart format lib/features/admin/domain/schedule_changes.dart lib/features/admin/presentation/admin_slots_page.dart test/schedule_changes_test.dart
      - run: flutter analyze
      - run: flutter test
      - uses: actions/upload-artifact@v4
        with:
          name: formatted-schedule-source
          path: |
            lib/features/admin/domain/schedule_changes.dart
            lib/features/admin/presentation/admin_slots_page.dart
            test/schedule_changes_test.dart
          retention-days: 7

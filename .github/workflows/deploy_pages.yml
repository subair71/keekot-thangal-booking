name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Generate production config
        env:
          FIREBASE_WEB_CONFIG: ${{ secrets.FIREBASE_WEB_CONFIG || vars.FIREBASE_WEB_CONFIG }}
        run: |
          if [ -n "$FIREBASE_WEB_CONFIG" ]; then
            echo "$FIREBASE_WEB_CONFIG" > config/production.json
          else
            cat << 'EOF' > config/production.json
          {
            "ENVIRONMENT": "production",
            "USE_EMULATORS": false,
            "FIREBASE_API_KEY": "AIzaSyC5TBTuiJowU0Ja-cs_nsdl2oYIV80FMl8",
            "FIREBASE_APP_ID": "1:630053774074:web:e934ba0182414aad589f43",
            "FIREBASE_MESSAGING_SENDER_ID": "630053774074",
            "FIREBASE_PROJECT_ID": "keekot-thangal-booking",
            "FIREBASE_AUTH_DOMAIN": "keekot-thangal-booking.firebaseapp.com",
            "FIREBASE_STORAGE_BUCKET": "keekot-thangal-booking.firebasestorage.app",
            "FUNCTIONS_REGION": "asia-south1",
            "EMULATOR_HOST": "127.0.0.1",
            "VAPID_KEY": "BL4DcMmrIb8RA_Sr5zjdf-wb3oRfItNdTlwn_yNdBQWHxTlGNYOccs3yH_u3weKTRYHK7iL_i47dXc9eBj1M1zA",
            "APP_CHECK_SITE_KEY": "6LcJbbotAAAAAPm8eUd9IRKeRNlTpiuCiIBpnSDk",
            "ENABLE_ANALYTICS": false
          }
          EOF
          fi

      - name: Configure Web SDK
        run: python3 tool/configure_web.py config/production.json

      - name: Install dependencies
        run: flutter pub get --enforce-lockfile

      - name: Run code generation
        run: dart run build_runner build

      - name: Build Flutter Web for GitHub Pages
        run: flutter build web --release --base-href="/keekot-thangal-booking/" --dart-define-from-file=config/production.json

      - name: Setup SPA 404 Fallback
        run: cp build/web/index.html build/web/404.html

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: build/web

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

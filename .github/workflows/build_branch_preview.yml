name: Build branch Site preview
on:
  push:
    branches: [feature/zip-inspired-enhancements]
    paths:
      - '.github/workflows/build_branch_preview.yml'
      - 'lib/**'
      - 'assets/**'
      - 'web/**'
      - 'pubspec*'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.4'
          channel: stable
          cache: true
      - run: flutter pub get --enforce-lockfile
      - name: Read existing public Firebase configuration
        run: |
          python3 - <<'PY'
          import pathlib, re
          workflow = pathlib.Path('.github/workflows/deploy_pages.yml').read_text()
          config = re.search(r'\{\s*"ENVIRONMENT": "production".*?\}', workflow, re.S).group(0)
          pathlib.Path('config/production.json').write_text(config)
          PY
      - run: python3 tool/configure_web.py config/production.json
      - run: flutter build web --release --base-href=/ --dart-define-from-file=config/production.json
      - uses: actions/upload-artifact@v4
        with:
          name: branch-site-preview
          path: build/web
          retention-days: 7

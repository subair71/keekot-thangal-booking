name: Build branch Site preview
on:
  push:
    branches: [preview/premium-ui-refresh]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.4'
          channel: stable
          cache: true
      - run: flutter pub get --enforce-lockfile
      - run: flutter analyze tool/preview_main.dart
      - run: flutter build web --release --target tool/preview_main.dart --base-href=/ --dart-define=ENVIRONMENT=preview --no-web-resources-cdn
      - uses: actions/upload-artifact@v4
        with:
          name: branch-site-preview
          path: build/web
          retention-days: 7
